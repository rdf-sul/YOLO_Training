site_name: YOLO Training – Bilder-KI verstehen und trainieren
site_description: Lernseite zur Objekterkennung mit Ultralytics YOLO für angehende Elektrotechniker
site_url: https://rdf-sul.github.io/YOLO_Training/
repo_url: https://github.com/rdf-sul/YOLO_Training
repo_name: rdf-sul/YOLO_Training
edit_uri: ""
copyright: Unterrichtsmaterial · Inhalte zu Ultralytics © Ultralytics (AGPL-3.0)

theme:
  name: material
  language: de
  icon:
    logo: material/eye-outline
    repo: fontawesome/brands/github
  favicon: assets/img/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Start:
      - index.md
      - Lernpfad & Zeitplan: lernpfad.md
  - 1 · Grundlagen:
      - grundlagen/index.md
      - Live-Demo im Browser: grundlagen/live-demo.md
      - YOLO & Ultralytics: grundlagen/yolo-ultralytics.md
      - Aufgabenarten (Tasks): grundlagen/aufgaben.md
      - Welches Modell?: grundlagen/modelle.md
      - Installation mit uv: grundlagen/installation-uv.md
  - 2 · Daten:
      - daten/index.md
      - Datensätze finden: daten/datensaetze.md
      - Daten labeln: daten/labeln.md
      - Die data.yaml: daten/data-yaml.md
  - 3 · Training:
      - training/index.md
      - Ablauf eines Trainings: training/ablauf.md
      - Parameter einstellen: training/parameter.md
      - Ergebnisse verstehen: training/ergebnisse.md
  - 4 · Praxis:
      - praxis/index.md
      - Erstes Training in Colab: praxis/erstes-training.md
      - Modell testen mit Solutions: praxis/solutions.md
  - 5 · Projekt:
      - projekt/index.md
      - Gute Trainingsbilder: projekt/bilder-aufnehmen.md
      - P1 · Daten sammeln: projekt/p1-daten-sammeln.md
      - P2 · Labeln und prüfen: projekt/p2-labeln.md
      - P3 · Training in Colab: projekt/p3-training.md
      - Nachtraining: projekt/nachtraining.md
  - Glossar: glossar.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: Auf dieser Seite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md

plugins:
  - search:
      lang: de

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - assets/js/quiz.js
  - assets/js/experimente.js
  - assets/js/live-demo.js

hooks:
  - hooks/vorlage_zip.py

watch:
  - includes
  - projekt-vorlage
